[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ehnn"
version = "0.1.0"
description = "Enhanced Hybrid Neural Network for CRISPR-Cas9 off-target prediction"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Akhtar Sayed"}]
requires-python = ">=3.9"
dependencies = [
    "tensorflow>=2.6",
    "scikit-learn>=0.24",
    "numpy>=1.19",
    "pandas>=1.1",
    "matplotlib>=3.3",
    "seaborn>=0.11",
    "biopython>=1.78",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
